# Configuração do build para o Railway (Nixpacks).
#
# Precisamos de Python (backend) E Node (para compilar o React). Por defeito o
# Nixpacks só detetaria um deles; aqui garantimos ambos e definimos os passos.

[phases.setup]
# Ambientes necessários: Python 3.14, Node 22, e pip.
nixPkgs = ["python314", "nodejs_22", "postgresql"]

[phases.install]
cmds = [
  # Dependências do backend.
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  # Dependências do frontend.
  "npm ci --prefix frontend",
]

# NOTA: não há fase [build] com passos próprios. O build do React, o
# collectstatic e o migrate correm todos no arranque (ver [start]). Razão: o
# Nixpacks nem sempre preserva o que se gera na fase [build] para o container de
# runtime (o staticfiles/ estava a faltar). Gerando tudo no arranque, garante-se
# que está no mesmo container onde corre o gunicorn.

[start]
# Ordem no arranque:
#  1) npm ci          -> garante o node_modules do frontend (a fase [install]
#                         pode não sobreviver ao runtime, tal como o staticfiles);
#  2) build do React  -> frontend/dist (com base=/static/ e paths corretos);
#  3) collectstatic    -> recolhe Admin + assets do React para STATIC_ROOT
#                         (servidos pelo WhiteNoise);
#  4) migrate          -> aplica migrações (a BD só está acessível em runtime);
#  5) gunicorn         -> servidor WSGI de produção. $PORT vem do Railway.
# Se qualquer passo falhar, o arranque falha de forma clara (o && corta a cadeia).
cmd = "npm ci --prefix frontend && npm run build --prefix frontend && python manage.py collectstatic --no-input && python manage.py migrate --no-input && gunicorn config.wsgi --bind 0.0.0.0:$PORT"
